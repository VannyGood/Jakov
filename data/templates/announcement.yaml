type: announcement
title: "📣 Announcement"
palette: [megaphone, news, info, point, check]
questions:
  - key: topic
    prompt: "📣 Headline / what's it about?"
    required: true
    max_len: 120
  - key: details
    prompt: "📝 Details (one or two sentences):"
    required: false
    max_len: 600
  - key: when
    prompt: "📅 Is there a date? (e.g. <i>monday 10:00</i>, <i>01.11</i>) — or skip"
    kind: datetime
    required: false
tones:
  hype:
    hooks:
      - "{emoji:megaphone} <b>{BIG NEWS|HUGE ANNOUNCEMENT|IT'S OFFICIAL}!</b> {emoji:fire}"
      - "{emoji:hype} <b>{topic}</b> {emoji:rocket}"
      - "{emoji:warning} <b>{Attention everyone|Listen up|Heads up}!</b> {emoji:megaphone}"
    bodies:
      - "<b>{topic}</b>{!|!!| and we can't wait!} {emoji:party}[[\n\n{details}]]"
      - "{We're thrilled to announce|We're excited to share|Finally}: <b>{topic}</b> {emoji:star}[[\n\n{details}]]"
      - "[[{details}\n\n]]{This is huge|You don't want to miss this|Game changer} {emoji:fire}"
    ctas:
      - "[[{emoji:calendar} <b>{when}</b> ({countdown} to go)]]\n{Stay tuned|More soon|Spread the word}! {emoji:megaphone}"
      - "{emoji:point} {Share this with your friends|Turn on notifications|Don't miss the next update}!"
      - "[[{emoji:clock} {Mark your calendar|Save the date}: {when}]]\n{emoji:fire} {Let's go|Here we go}!"
  chill:
    hooks:
      - "{emoji:wave} {Hey everyone|Hi all|Quick update}"
      - "{emoji:news} <b>{topic}</b>"
      - "{emoji:sparkles} {Small update|A bit of news|Some news} for you"
    bodies:
      - "<b>{topic}</b>[[\n\n{details}]]"
      - "{Just letting you know|FYI|In case you missed it}: <b>{topic}</b> {emoji:chill}[[\n{details}]]"
      - "[[{details}\n\n]]{That's all for now|Nothing else to add|More soon} {emoji:cool}"
    ctas:
      - "[[{emoji:calendar} {when}]]\n{Have a great day|Thanks for reading|Enjoy} {emoji:wave}"
      - "[[{emoji:calendar} {when}]]"
      - "{Questions? Just ask|Ping us if anything's unclear} {emoji:sparkles}"
  funny:
    hooks:
      - "{emoji:laugh} {Breaking news (actually important this time)|Stop scrolling|Plot twist}!"
      - "{emoji:eyes} {Guess what|You won't believe this|Read this before your coffee}"
      - "{emoji:megaphone} {Hear ye, hear ye|Attention, humans|This is not a drill}!"
    bodies:
      - "<b>{topic}</b>{. Yes, really| (we're as surprised as you)|. Act natural} {emoji:laugh}[[\n\n{details}]]"
      - "[[{details}\n\n]]{Any questions? No? Great|Read it twice, it's important|That's it, that's the post} {emoji:ghost}"
      - "{After much debate and three coffees|After a long meeting with ourselves|The council has decided}: <b>{topic}</b> {emoji:devil}[[\n{details}]]"
    ctas:
      - "[[{emoji:calendar} {when}, set an alarm, then another one]]\n{emoji:laugh}"
      - "{emoji:point} {Tell your mum|Tell your cat|Tell everyone}!"
      - "[[{emoji:clock} {countdown} left to pretend you didn't see this]]"
  serious:
    hooks:
      - "{emoji:info} <b>{Announcement|Notice|Update}</b>"
      - "{emoji:megaphone} <b>{topic}</b>"
      - "{emoji:serious} <b>{Important|Official} {update|notice}</b>"
    bodies:
      - "<b>{topic}</b>[[\n\n{details}]]"
      - "{We would like to inform you|Please note|Kindly be informed}: <b>{topic}</b>.[[\n\n{details}]]"
      - "[[{details}\n\n]]{Thank you for your attention|Thank you for your understanding}."
    ctas:
      - "[[{emoji:calendar} Date: <b>{when}</b>]]"
      - "[[{emoji:calendar} {when}]]\n{emoji:check} {Further details will follow|We will keep you updated}."
      - "{emoji:point} {Questions can be sent to the admins|Contact us with any questions}."
