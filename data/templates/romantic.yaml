type: romantic
title: "💘 Romantic"
palette: [love, rose, sparkles, kiss]
questions:
  - key: for
    prompt: "💘 Who is it for? (a name, <i>my love</i>, <i>you</i>…)"
    required: true
    max_len: 60
  - key: mood
    prompt: "💞 Pick the mood:"
    kind: choice
    required: true
    options:
      - {value: sweet, label: "🥰 Sweet", palette: [love, cute, sparkles]}
      - {value: passionate, label: "❤‍🔥 Passionate", palette: [heart_fire, fire, kiss]}
      - {value: missing, label: "🥺 Missing you", palette: [sad, love, rose]}
      - {value: celebrate, label: "🎉 Anniversary", palette: [party, love, gift]}
tones:
  hype:
    hooks:
      - "{emoji} <b>{for}</b>, {you are EVERYTHING|you light up my world|you're my favourite person ever}! {emoji}"
      - "{emoji:heart_fire} <b>{Shout out to|All my love to|This one's for} {for}</b>! {emoji:heart_fire}"
      - "{emoji:love} <b>{Breaking news|Official announcement|Big news}:</b> I'm {crazy about|obsessed with|madly in love with} <b>{for}</b>! {emoji}"
    bodies:
      - "{Every day with you feels like a win|You make every day brighter|My heart does backflips when I see you} {emoji}"
      - "{You're my favourite notification|You're the best thing that ever happened to me|Nobody compares to you} {emoji:sparkles}"
      - "{I'd choose you|I'd pick you|It's you} {every single time|over and over again|in every universe} {emoji:love}"
    ctas:
      - "{Forever yours|Always yours|Yours, now and always} {emoji:kiss}"
      - "{Love you to the moon and back|Love you more than words can say|Love you, always} {emoji}"
      - "{emoji:rose} {Today|Tonight|Always} is about <b>{for}</b> {emoji:love}"
  chill:
    hooks:
      - "{emoji} {Just a little note|A small reminder|Quiet thought} for <b>{for}</b>"
      - "{emoji:sparkles} <b>{for}</b>,"
      - "{emoji:rose} {Thinking of you|Thinking about you|You crossed my mind}, <b>{for}</b>"
    bodies:
      - "{You make ordinary moments feel special|Being with you feels like home|Everything is calmer with you} {emoji}"
      - "{I hope you know how much you mean to me|You mean more to me than you know|Grateful for you, every day} {emoji:love}"
      - "{Coffee tastes better|Sunsets look better|Songs sound better} {with you around|when you're here} {emoji}"
    ctas:
      - "{Always|Love|With love}, me {emoji}"
      - "{Have a beautiful day|Sleep sweet|Talk soon} {emoji:sparkles}"
      - "{emoji:love}"
  funny:
    hooks:
      - "{emoji:laugh} <b>{for}</b>, {you've been officially|you are hereby|congratulations, you've been} {stuck with me|adopted by me|chosen} {forever|for life}"
      - "{emoji:eyes} {Roses are red, violets are blue|Plot twist|Fun fact}…"
      - "{emoji:cat} <b>{for}</b>, {you're my favourite human|I like you more than pizza|you're my emergency contact AND my snack buddy}"
    bodies:
      - "{I love you more than my phone|You're the reason I check my phone|I'd share my fries with you (that's huge)} {emoji:laugh}"
      - "{Roses are red, violets are blue, I'm bad at poems but I love you|You stole my heart, but I'll let you keep it|You're weird, I'm weird, it's perfect} {emoji}"
      - "{Thanks for laughing at my terrible jokes|Thanks for tolerating me|You make my bad days less bad} {emoji:laugh}"
    ctas:
      - "{No refunds|No take-backs|Terms and conditions apply}. {emoji:kiss}"
      - "{Love you, weirdo|Love you, dork|Stay cute} {emoji}"
      - "{emoji:devil} {Now feed me|Now kiss me|Now admit I'm your favourite}"
  serious:
    hooks:
      - "{emoji:rose} <b>To {for}</b>"
      - "{emoji} <b>{for}</b>,"
      - "{emoji:love} {A message|Words} for <b>{for}</b>"
    bodies:
      - "{Thank you for being there through everything|Thank you for your patience, your kindness and your love|You have made my life better in every way} {emoji}"
      - "{I don't say it enough, but you mean the world to me|What we have is rare and I treasure it|I am grateful for every moment we share}."
      - "{You are my partner, my friend and my home|My love for you grows every day|I promise to always stand by you} {emoji}"
    ctas:
      - "{With all my love|Yours, always|Forever grateful} {emoji:love}"
      - "{emoji:rose}"
      - "{Always|Forever}, {emoji}"
