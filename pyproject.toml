[project]
name = "jakov"
version = "0.1.0"
description = "Jakov: Telegram publisher, guard and scanner bot"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "aiosqlite>=0.21",
    "alembic>=1.15",
    "pydantic-settings>=2.8",
    "structlog>=25.1",
    "pyyaml>=6.0",
    "tzdata>=2025.1",
    "timezonefinder>=6.5",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.15", "types-PyYAML"]

[project.scripts]
jakov = "jakov.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF", "N", "S", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"migrations/**" = ["N999", "E501", "W291"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["jakov"]

[[tool.mypy.overrides]]
module = ["timezonefinder.*"]
ignore_missing_imports = true
